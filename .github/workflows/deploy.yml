# Manual production deploy for the Play production track.
# Run from Actions → Production Deploy → Run workflow.
# workflow_dispatch only: the bump commit is pushed to main, and a push
# trigger would start another deploy.
name: Production Deploy

on:
  workflow_dispatch:

# One production upload at a time. A second run waits; it does not cancel
# the in-progress upload.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Build and ship to production
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Not pinned. pubspec sdk: ^3.11.3 accepts current stable (Dart 3.13).
      # Verified with stable 3.47.9. The project was created with Flutter 3.41.5.
      # Gradle 8.14, AGP 8.11.1, and Kotlin 2.2.20 are that stable's minimum
      # supported versions, so the Android dependency check warns and does not
      # fail the build.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # No release AdMob check in this repo. Dog Game has no ads SDK, no ad
      # unit ids, and no tool/validate_admob.dart. Nothing to run here.

      - name: Bump pubspec build number
        id: version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          path = Path("pubspec.yaml")
          text = path.read_bytes().decode("utf-8")
          newline = "\n"
          if "\r\n" in text:
              newline = "\r\n"
          lines = text.splitlines()
          indexes = [i for i, line in enumerate(lines) if line.startswith("version:")]
          if not indexes:
              sys.exit(
                  "error: pubspec.yaml has no top-level version: line. "
                  "Expected a line like version: 1.0.0+1."
              )
          if len(indexes) != 1:
              sys.exit(
                  "error: pubspec.yaml has "
                  f"{len(indexes)} top-level version: lines. Expected exactly one."
              )

          index = indexes[0]
          core = lines[index]
          match = re.fullmatch(
              r'(version:\s*)(?:"([^"]*)"|\'([^\']*)\'|(\S+))(\s*(?:#.*)?)',
              core,
          )
          if match is None:
              sys.exit(
                  "error: could not parse the pubspec version line: "
                  f"{core!r}. Expected version: 1.0.0+1."
              )
          if match.group(2) is not None:
              quote = '"'
              value = match.group(2)
          elif match.group(3) is not None:
              quote = "'"
              value = match.group(3)
          else:
              quote = ""
              value = match.group(4)

          if "+" not in value:
              sys.exit(
                  f"error: pubspec version {value!r} is missing the +build number. "
                  "Expected a version like 1.0.0+1."
              )
          if value.count("+") != 1:
              sys.exit(
                  f"error: pubspec version {value!r} must contain exactly one "
                  "+build suffix, for example 1.0.0+1."
              )
          build_name, build_text = value.split("+", 1)
          if build_name == "":
              sys.exit(
                  f"error: pubspec version {value!r} is missing the version name "
                  "before +."
              )
          if re.fullmatch(r"[0-9]+", build_text) is None or int(build_text) < 1:
              sys.exit(
                  f"error: pubspec build number {build_text!r} is not a positive "
                  "integer. The +build part must be an integer greater than zero."
              )

          build_number = int(build_text) + 1
          bumped = f"{build_name}+{build_number}"
          lines[index] = (
              f"{match.group(1)}{quote}{bumped}{quote}{match.group(5)}"
          )
          updated = newline.join(lines)
          if text.endswith(("\n", "\r\n")):
              updated += newline
          if updated == text:
              sys.exit("error: version bump did not change pubspec.yaml.")
          path.write_bytes(updated.encode("utf-8"))

          output = os.environ.get("GITHUB_OUTPUT")
          if not output:
              sys.exit("error: GITHUB_OUTPUT is not set.")
          with open(output, "a", encoding="utf-8") as handle:
              handle.write(f"version={bumped}\n")
              handle.write(f"build_name={build_name}\n")
              handle.write(f"build_number={build_number}\n")
          print(f"Bumped pubspec version to {bumped}")
          PY

      # flutter pub get rewrites pubspec.lock and, on current stable, also
      # rewrites analysis_options.yaml (it adds analyzer excludes for build/
      # and the platform directories). Commit only pubspec.yaml. Those pub get
      # outputs are expected; any other leftover path fails the job. Ignoring
      # only pubspec.lock failed the first real Undercover production run.
      - name: Commit and push version bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pubspec.yaml
          staged="$(git diff --cached --name-only)"
          if [[ "${staged}" != "pubspec.yaml" ]]; then
            echo "::error::version bump must stage only pubspec.yaml."
            printf '%s\n' "${staged}"
            exit 1
          fi
          git commit -m "chore: bump version to ${VERSION}"
          git push origin HEAD:main
          unexpected="$(
            git status --porcelain=v1 --untracked-files=all | while IFS= read -r line || [[ -n "${line}" ]]; do
              if [[ -z "${line}" ]]; then
                continue
              fi
              path="${line:3}"
              if [[ "${path}" == *" -> "* ]]; then
                path="${path##* -> }"
              fi
              if [[ "${path}" == \"*\" ]]; then
                path="${path#\"}"
                path="${path%\"}"
              fi
              case "${path}" in
                pubspec.lock|analysis_options.yaml|.flutter-plugins|.flutter-plugins-dependencies|.packages|.dart_tool|.dart_tool/*)
                  continue
                  ;;
              esac
              printf '%s\n' "${line}"
            done
          )"
          if [[ -n "${unexpected}" ]]; then
            echo "::error::version bump left unexpected working tree changes"
            printf '%s\n' "${unexpected}"
            exit 1
          fi

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "::error::KEYSTORE_BASE64 is empty."
            exit 1
          fi
          mkdir -p android/app/keystore
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > android/app/keystore/upload-keystore.jks
          if [[ ! -s android/app/keystore/upload-keystore.jks ]]; then
            echo "::error::KEYSTORE_BASE64 did not decode to a keystore."
            exit 1
          fi

      # android/app/build.gradle.kts already loads this file with
      # rootProject.file("key.properties") and passes storeFile to file().
      # file() keeps an absolute path absolute, so storeFile is the absolute
      # keystore path. versionCode and versionName already come from flutter.*.
      - name: Write android/key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          required = ("KEYSTORE_PASSWORD", "KEY_PASSWORD", "KEY_ALIAS")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              sys.exit(
                  "error: missing signing secret(s): " + ", ".join(missing) + "."
              )

          def prop_escape(value: str) -> str:
              # android/app/build.gradle.kts loads key.properties with
              # Properties.load(InputStream), which decodes ISO-8859-1 escapes.
              escaped = []
              for char in value:
                  code = ord(char)
                  if char == "\\":
                      escaped.append("\\\\")
                  elif char == "\n":
                      escaped.append("\\n")
                  elif char == "\r":
                      escaped.append("\\r")
                  elif char == "\t":
                      escaped.append("\\t")
                  elif char in "=: #!":
                      escaped.append("\\" + char)
                  elif code < 0x20 or code > 0x7E:
                      escaped.append(f"\\u{code:04x}")
                  else:
                      escaped.append(char)
              return "".join(escaped)

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          store_file = (
              workspace / "android" / "app" / "keystore" / "upload-keystore.jks"
          )
          if not store_file.is_file():
              sys.exit(f"error: keystore was not restored at {store_file}.")

          contents = "\n".join(
              [
                  f"storePassword={prop_escape(os.environ['KEYSTORE_PASSWORD'])}",
                  f"keyPassword={prop_escape(os.environ['KEY_PASSWORD'])}",
                  f"keyAlias={prop_escape(os.environ['KEY_ALIAS'])}",
                  f"storeFile={prop_escape(str(store_file))}",
                  "",
              ]
          )
          Path("android/key.properties").write_text(contents, encoding="ascii")
          print(f"Wrote android/key.properties with storeFile={store_file}")
          PY

      - name: Read applicationId
        id: app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          text = Path("android/app/build.gradle.kts").read_text(encoding="utf-8")
          matches = re.findall(
              r'(?m)^[ \t]*applicationId\s*=\s*"([^"]+)"\s*$',
              text,
          )
          if len(matches) != 1 or matches[0] == "":
              sys.exit(
                  "error: expected exactly one applicationId assignment in "
                  f"android/app/build.gradle.kts, found {matches!r}."
              )
          package_name = matches[0]
          output = os.environ.get("GITHUB_OUTPUT")
          if not output:
              sys.exit("error: GITHUB_OUTPUT is not set.")
          with open(output, "a", encoding="utf-8") as handle:
              handle.write(f"package_name={package_name}\n")
          print(f"Play package name is {package_name}")
          PY

      # android/gradle.properties sets -Xmx8G. MaxMetaspaceSize=4G is a
      # ceiling, not a reservation, and ReservedCodeCacheSize is 512m.
      # This repo is public, so ubuntu-latest has 16 GB RAM and the 8G heap
      # fits. Private ubuntu-latest runners have 8 GB and would need a runtime
      # cap. Do not commit a lower heap into gradle.properties.
      # android/gradlew is gitignored; Flutter writes it at build time and
      # keeps gradle-wrapper.properties (Gradle 8.14). The same build migrates
      # android.builtInKotlin=false and android.newDsl=false into
      # gradle.properties in the workspace only, after the clean-tree check.
      - name: Build release app bundle
        env:
          BUILD_NAME: ${{ steps.version.outputs.build_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --build-name="${BUILD_NAME}" \
            --build-number="${BUILD_NUMBER}"

      - name: Verify bundle version and signing
        env:
          BUILD_NAME: ${{ steps.version.outputs.build_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          EXPECTED_PACKAGE: ${{ steps.app.outputs.package_name }}
        run: |
          set -euo pipefail
          aab="build/app/outputs/bundle/release/app-release.aab"
          if [[ ! -s "${aab}" ]]; then
            echo "::error::Release app bundle was not produced at ${aab}."
            exit 1
          fi
          curl -fsSL -o "${RUNNER_TEMP}/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          manifest_attr() {
            java -jar "${RUNNER_TEMP}/bundletool.jar" dump manifest \
              --bundle="${aab}" \
              --xpath "$1" | tr -d '[:space:]'
          }
          actual_code="$(manifest_attr /manifest/@android:versionCode)"
          actual_name="$(manifest_attr /manifest/@android:versionName)"
          actual_package="$(manifest_attr /manifest/@package)"
          if [[ "${actual_code}" != "${BUILD_NUMBER}" || "${actual_name}" != "${BUILD_NAME}" || "${actual_package}" != "${EXPECTED_PACKAGE}" ]]; then
            echo "::error::Bundle manifest mismatch. Expected versionName=${BUILD_NAME} versionCode=${BUILD_NUMBER} package=${EXPECTED_PACKAGE}. Got versionName=${actual_name} versionCode=${actual_code} package=${actual_package}."
            exit 1
          fi
          echo "Bundle manifest matches ${actual_name}+${actual_code} (${actual_package})."
          certs="$(keytool -printcert -jarfile "${aab}")"
          printf '%s\n' "${certs}"
          if ! printf '%s\n' "${certs}" | grep -q 'Certificate #'; then
            echo "::error::Bundle has no signer certificate."
            exit 1
          fi
          if printf '%s\n' "${certs}" | grep -E -q 'CN=Android Debug(,|$)'; then
            echo "::error::Bundle is debug-signed (CN=Android Debug). Release must use the upload keystore."
            exit 1
          fi
          echo "Bundle signer is not the Android debug certificate."

      - name: Upload to Play production
        id: play
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: ${{ steps.app.outputs.package_name }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: production
          status: completed

      - name: Note on Play upload failure
        if: failure() && steps.play.outcome == 'failure'
        run: |
          echo "::notice::An upload failure can mean either (a) \"The caller does not have permission\": the Play service account has no release access to this app under Users and permissions in Play Console, or (b) a version code already on Play, in which case run again."
